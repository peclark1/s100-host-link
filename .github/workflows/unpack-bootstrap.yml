name: Unpack initial source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/s100-host-link-v4.1.tar.xz'
      - '.github/workflows/unpack-bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack tested v4.1 source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf bootstrap/s100-host-link-v4.1.tar.xz --strip-components=1
          rm -rf bootstrap
          rm -f .github/workflows/unpack-bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add S-100 Host Link v4.1 source'
          git push
